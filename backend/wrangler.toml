name = "vidsage-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set real value after creating Supabase project
SUPABASE_URL = ""

# Prices — set after creating Stripe products
STRIPE_PRICE_MONTHLY = ""
STRIPE_PRICE_ANNUAL = ""

# Allowed extension origins (comma-separated chrome-extension:// IDs)
ALLOWED_ORIGINS = "*"

# Secrets — set via: wrangler secret put <NAME>
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_JWT_SECRET
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# OPENAI_API_KEY
# ANTHROPIC_API_KEY
# GEMINI_API_KEY
